[project]
name = "portfolio-mf-stocks-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "yfinance>=0.2.50",
    "openpyxl>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.40.0",
    "psycopg-binary>=3.3.6",
    "mftool>=2.0.0",
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "pyotp>=2.9.0",
    "growwapi>=1.5.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
